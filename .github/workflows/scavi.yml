name: Scavi

on:
  pull_request:

permissions:
  contents: read

jobs:
  context-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AI coding context
        uses: ./
        with:
          diff-base: ${{ github.event.pull_request.base.sha }}
          fail-on-deterministic: true
