name: Scavi Context Check
description: Check whether AI coding instructions still match the repository.
author: Scavi

inputs:
  repository-path:
    description: Repository path to analyze.
    required: false
    default: .
  diff-base:
    description: Optional Git revision used to report and fail only on issues affected by the change.
    required: false
  fail-on-deterministic:
    description: Fail the action when deterministic errors are found.
    required: false
    default: "true"

outputs:
  issue-count:
    description: Number of reported Scavi issues, filtered to affected issues when diff-base is set.
  error-count:
    description: Number of deterministic errors.
  changed-files:
    description: JSON array of files changed since diff-base.

runs:
  using: node20
  main: packages/github-action/dist/index.cjs

branding:
  icon: search
  color: purple
